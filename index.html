<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>安達旅平險試算</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：單欄工具頁，上方標題與費率版本，中間輸入，下方明細，底部固定一條保費。 */
:root{
  --bg:#f3f5f7; --card:#ffffff; --ink:#18212b; --mute:#5d6b79; --line:#d8dee4;
  --accent:#1d4f91; --accent-ink:#ffffff; --accent-soft:#e4edf8;
  --ok:#1e6b45; --ok-soft:#e2f2e9; --warn:#8a4b00; --warn-soft:#fbeed8; --bad:#a3271d; --bad-soft:#fbe4e1;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161c; --card:#18212a; --ink:#e7ecf1; --mute:#99a6b3; --line:#2b3743;
  --accent:#6aa4ec; --accent-ink:#0b1a2b; --accent-soft:#1c2f46;
  --ok:#6fd3a0; --ok-soft:#173326; --warn:#f0b866; --warn-soft:#38290f; --bad:#ff9b8f; --bad-soft:#3d1b17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161c; --card:#18212a; --ink:#e7ecf1; --mute:#99a6b3; --line:#2b3743;
  --accent:#6aa4ec; --accent-ink:#0b1a2b; --accent-soft:#1c2f46;
  --ok:#6fd3a0; --ok-soft:#173326; --warn:#f0b866; --warn-soft:#38290f; --bad:#ff9b8f; --bad-soft:#3d1b17; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
.wrap{max-width:640px;margin:0 auto;display:grid;gap:14px;min-width:0}
h1{font-size:1.35rem;margin:0;letter-spacing:.01em}
.sub{color:var(--mute);font-size:.85rem;margin:2px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.card h2{font-size:.95rem;margin:0;color:var(--mute);font-weight:500;letter-spacing:.04em}
label{display:grid;gap:4px;font-size:.85rem;color:var(--mute);min-width:0}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;font:inherit;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.note{font-size:.82rem;color:var(--mute);margin:0}
.msg{font-size:.85rem;padding:8px 10px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:500;font-size:.8rem}
tfoot td{font-weight:700;border-bottom:0}
.scroll{overflow-x:auto}
details summary{cursor:pointer;color:var(--accent);font-size:.88rem}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
.bar .in{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.big{font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.per{color:var(--mute);font-size:.85rem;font-variant-numeric:tabular-nums}
.copy{font:inherit;padding:9px 14px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;font-weight:500}
.cmp{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>安達旅平險試算</h1>
    <p class="sub">個人客戶投保美商安達產物。依「<span id="ver"></span>」費率，結果與 Excel 試算表一致。</p>
  </header>

  <section class="card">
    <h2>投保險種</h2>
    <div class="seg" id="type">
      <button type="button" data-v="海外加值型">海外加值型</button>
      <button type="button" data-v="申根加值型">歐洲申根加值型</button>
      <button type="button" data-v="國內外基本型">國內外基本型</button>
    </div>
    <div class="row">
      <label>被保險人保險年齡（歲）<input id="age" type="number" inputmode="numeric" min="0" max="85"></label>
      <label>人數<input id="people" type="number" inputmode="numeric" min="1"></label>
    </div>
    <details>
      <summary>用生日算保險年齡</summary>
      <div class="row" style="margin-top:10px">
        <label>出生日期<input id="birth" type="date"></label>
        <label>以生效日計算<input id="birthAt" type="text" readonly></label>
      </div>
      <p class="note">超過實足歲生日滿六個月零一天，保險年齡加一歲。</p>
    </details>
  </section>

  <section class="card">
    <h2>保險期間</h2>
    <div class="row">
      <label>生效日<input id="d1" type="date"></label>
      <label>生效時（0–23）<input id="h1" type="number" inputmode="numeric" min="0" max="23"></label>
      <label>滿期日<input id="d2" type="date"></label>
      <label>滿期時（0–23）<input id="h2" type="number" inputmode="numeric" min="0" max="23"></label>
    </div>
    <label>旅遊天數（1–180，可直接修改）<input id="days" type="number" inputmode="numeric" min="1" max="180"></label>
    <p class="note">天數＝滿期日減生效日；滿期時大於生效時再加一天。</p>
  </section>

  <section class="card">
    <h2>保險內容</h2>
    <label>身故／失能保險金（ADD）<select id="add"></select></label>
    <label>傷害醫療／海外突發疾病<select id="combo"></select></label>
    <div>
      <div class="note" style="margin-bottom:6px">旅行不便險（TI）</div>
      <div class="seg" id="ti">
        <button type="button" data-v="">不附加</button>
        <button type="button" data-v="超值型">超值型</button>
        <button type="button" data-v="尊榮型">尊榮型</button>
      </div>
    </div>
    <div id="alerts" style="display:grid;gap:8px"></div>
  </section>

  <section class="card">
    <h2>保費明細（每人）</h2>
    <div class="scroll"><table>
      <thead><tr><th>項目</th><th>保額</th><th>保費</th></tr></thead>
      <tbody id="tb"></tbody>
      <tfoot><tr><td>每人合計（四捨五入）</td><td></td><td id="per"></td></tr></tfoot>
    </table></div>
  </section>

  <section class="card">
    <h2>給詮國分析報告書</h2>
    <div class="row">
      <div><div class="note">總保額</div><div style="font-size:1.2rem;font-weight:700" id="tsum"></div></div>
      <div><div class="note">保費合計</div><div style="font-size:1.2rem;font-weight:700" id="tprem"></div></div>
    </div>
    <div class="cmp">
      <label>安達系統顯示的保費（選填，用來核對）<input id="chk" type="number" inputmode="numeric"></label>
      <div id="chkRes" class="note"></div>
    </div>
  </section>

  <p class="note">費率版本：<span id="ver2"></span>。保單簽發於這些版本之前的案件，保費可能與本表差幾元到幾十元。可選保額與險種以安達 TPEB2B 系統為準。</p>
</div>

<div class="bar"><div class="in">
  <div><div class="per" id="barPer"></div><div class="big" id="barTot"></div></div>
  <button class="copy" id="copy" type="button">複製總保額與保費</button>
</div></div>

const $=id=>document.getElementById(id);
const st={type:'海外加值型',ti:'尊榮型'};
const fmt=n=>Number(n).toLocaleString('zh-TW');
const AGE_LIMIT=a=>a<15?69:a<=65?2000:a<=70?1500:a<=75?500:a<=80?300:a<=85?100:0;
function rowsFor(){
  const age=+$('age').value||0, u15=age<15;
  const lim=AGE_LIMIT(age);
  return D.rows.filter(r=>r[0]===st.type && !!r[6]===u15 && r[1]<=lim);
}
function setPressed(box,v){box.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v?'true':'false'))}
function fillAdd(){
  const rows=rowsFor(); const adds=[...new Set(rows.map(r=>r[1]))].sort((a,b)=>a-b);
  const cur=$('add').value; $('add').innerHTML=adds.map(a=>`<option value="${a}">${fmt(a)} 萬</option>`).join('');
  if(adds.includes(+cur)) $('add').value=cur; else if(adds.includes(500)) $('add').value='500'; else if(adds.length) $('add').value=String(adds[adds.length-1]);
  fillCombo();
}
function comboLabel(r){return typeof r[3]==='number'?`傷害醫療 ${fmt(r[2])} 萬／突發疾病 ${fmt(r[3])} 萬`:`傷害醫療 ${fmt(r[2])} 萬`}
function fillCombo(){
  const add=+$('add').value; const rows=rowsFor().filter(r=>r[1]===add);
  $('combo').innerHTML=rows.map((r,i)=>`<option value="${i}">${comboLabel(r)}</option>`).join('');
  const keep=rows.findIndex(r=>String(r[2])+'/'+String(r[3])===window.__lastCombo);
  const k=rows.findIndex(r=>r[2]===50&&r[3]===50);
  $('combo').value=String(keep>=0?keep:(k>=0?k:0));
  sync();
}
function currentRow(){const add=+$('add').value; const rows=rowsFor().filter(r=>r[1]===add); return rows[+$('combo').value]||null}
function at(arr,d){return arr[d-1]}
function compute(row,age,days,n,ti){
  const out=[];
  const add=row[1], amr=row[2], emr=typeof row[3]==='number'?row[3]:0;
  const tA=add>0&&D.TA[String(add)]?at(D.TA[String(add)],days):0; out.push(['身故／失能（ADD）',add?`${fmt(add)} 萬`:'—',tA]);
  const tM=amr>=2?at(D.AMR[String(amr)],days):0; out.push(['傷害醫療（AMR）',`${fmt(amr)} 萬`,tM]);
  const tacc=age<15?0:add*0.2; const k=tacc===Math.floor(tacc)?String(tacc):String(tacc);
  const tC=tacc>=2?at(D.TACC[k],days):0; out.push(['大眾運輸增額（TACC）',tacc?`${fmt(tacc)} 萬`:'—',tC]);
  out.push(['食物中毒慰問（FPS）','3,000 元',D.FPS]);
  const tE=emr?at(D.EMR[String(emr)],days):0; out.push(['海外突發疾病（EMR）',emr?`${fmt(emr)} 萬`:'—',tE]);
  const tT=ti?at(D.TI[ti],days):0; out.push(['旅行不便險（TI）',ti||'不附加',tT]);
  const sum=out.reduce((s,x)=>s+x[2],0); const per=Math.round(sum+1e-9);
  return {out,per,total:per*n};
}
function tiAllowed(row,age){
  const sup=!!row[4], pre=!!row[5];
  if(st.type==='國內外基本型') return {超值型:false,尊榮型:false};
  if(age>80) return {超值型:sup&&!!row[7],尊榮型:false};
  return {超值型:sup,尊榮型:pre};
}
function sync(){
  const row=currentRow(); const age=+$('age').value||0; const days=Math.round(+$('days').value||0); const n=Math.max(1,Math.round(+$('people').value||1));
  const alerts=[]; const box=$('alerts'); box.innerHTML='';
  const add=(t,c)=>{const d=document.createElement('div'); d.className='msg '+(c||''); d.textContent=t; box.appendChild(d)};
  setPressed($('type'),st.type);
  if(!row){$('tb').innerHTML=''; add('這個年齡與險種沒有可投保的保額組合。','bad'); render(null); return}
  const al=tiAllowed(row,age);
  $('ti').querySelectorAll('button').forEach(b=>{const v=b.dataset.v; b.disabled=v!==''&&!al[v]});
  if(st.ti&&!al[st.ti]) st.ti='';
  setPressed($('ti'),st.ti);
  if(age>85) add('超過 85 歲，婉謝承保。','bad');
  if(days<1||days>180){add('旅遊天數要在 1 到 180 天之間。','bad'); render(null); return}
  if(age>80&&days>30) add('81–85 歲最長 30 天。','bad');
  if(st.type==='國內外基本型'&&days>30) add('國內旅行平安險以不超過 30 天為原則，較長期間要說明原因給核保人員審核。');
  if(age>=15&&age<=80&&st.ti==='超值型'&&row[1]<200) add('超值型旅行不便險限身故保額 200 萬以上。');
  if(row[7]) add(row[7]);
  const r=compute(row,age,days,n,st.ti);
  $('tb').innerHTML=r.out.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]?x[2].toFixed(2):'—'}</td></tr>`).join('');
  render({r,row,n});
  window.__lastCombo=String(row[2])+'/'+String(row[3]);
}
function render(x){
  if(!x){['per','tsum','tprem','barPer','barTot'].forEach(i=>$(i).textContent='—'); $('chkRes').textContent=''; return}
  $('per').textContent=fmt(x.r.per)+' 元';
  const tsum=x.row[1]*x.n; $('tsum').textContent=fmt(tsum)+' 萬'; $('tprem').textContent=fmt(x.r.total)+' 元';
  $('barPer').textContent=`每人 ${fmt(x.r.per)} 元 × ${x.n} 人`; $('barTot').textContent=`${fmt(x.r.total)} 元`;
  window.__result={tsum,total:x.r.total,per:x.r.per,n:x.n};
  const c=$('chk').value;
  if(c===''){$('chkRes').textContent='';$('chkRes').className='note'}
  else{const diff=+c-x.r.total; $('chkRes').className='msg '+(diff===0?'ok':'bad'); $('chkRes').textContent=diff===0?'吻合':`差 ${diff>0?'+':''}${fmt(diff)} 元`}
}
/* 日期與年齡 */
function parse(s){if(!s)return null;const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function calcDays(){
  const a=parse($('d1').value), b=parse($('d2').value); if(!a||!b) return;
  const h1=+$('h1').value||0, h2=+$('h2').value||0;
  const d=Math.round((b-a)/86400000)+(h2>h1?1:0);
  if(d>=1) $('days').value=d; sync();
}
function calcAge(){
  const b=parse($('birth').value), s=parse($('d1').value)||new Date(); if(!b){ $('birthAt').value=''; return }
  let age=s.getFullYear()-b.getFullYear(); let bd=new Date(s.getFullYear(),b.getMonth(),b.getDate());
  if(s<bd){age--; bd=new Date(s.getFullYear()-1,b.getMonth(),b.getDate())}
  const cut=new Date(bd.getFullYear(),bd.getMonth()+6,bd.getDate());
  const ins=age+(s>cut?1:0);
  $('birthAt').value=`實足 ${age} 歲，保險年齡 ${ins}`; $('age').value=ins; fillAdd();
}
$('type').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; st.type=b.dataset.v; fillAdd()});
$('ti').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b||b.disabled) return; st.ti=b.dataset.v; sync()});

$('copy').addEventListener('click',async()=>{
  const r=window.__result; if(!r) return; const t=`總保額 ${r.tsum} 萬、保費 ${r.total} 元`;
  try{await navigator.clipboard.writeText(t); $('copy').textContent='已複製'}catch(e){ $('copy').textContent=t }
  setTimeout(()=>{$('copy').textContent='複製總保額與保費'},2500);
});
